# Builds the public site as static files and deploys it to GitHub Pages.
#
# One-time setup on GitHub:
#   1. Settings → Pages → Build and deployment → Source: "GitHub Actions"
#   2. (For enquiries) Settings → Secrets and variables → Actions → New repository secret
#      WEB3FORMS_ACCESS_KEY = your free key from https://web3forms.com
#
# The admin panel can't run on Pages (no server). Manage products locally with `npm run dev`,
# then commit data/products.json and data/uploads/ and push — this workflow redeploys.

name: Deploy to GitHub Pages

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Remove server-only routes
        # Static export can't include the admin panel, the uploads route handler or the proxy
        run: rm -rf src/app/admin src/components/admin src/app/media src/proxy.ts

      - name: Copy product photos into the static site
        run: |
          mkdir -p public/media
          find data/uploads -type f ! -name .gitkeep -exec cp {} public/media/ \;

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_ACCESS_KEY }}

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
